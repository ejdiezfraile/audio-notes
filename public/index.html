<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Notas de Voz con IA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎤 Notas de Voz con IA</h1>
            <p>Graba, transcribe y organiza tus ideas automáticamente</p>
        </header>

        <!-- Sección de grabación -->
        <section class="recording-section">
            <div class="recorder-card">
                <div class="recorder-controls">
                    <button id="recordBtn" class="record-btn">
                        <span class="record-icon">🎤</span>
                        <span class="record-text">Iniciar Grabación</span>
                    </button>
                    <button id="stopBtn" class="stop-btn" disabled>
                        <span class="stop-icon">⏹️</span>
                        <span class="stop-text">Detener</span>
                    </button>
                </div>
                
                <div class="recording-status" id="recordingStatus">
                    <div class="status-text">Listo para grabar</div>
                    <div class="recording-timer" id="recordingTimer">00:00</div>
                </div>

                <div class="audio-preview" id="audioPreview" style="display: none;">
                    <audio controls id="audioPlayer"></audio>
                    <button id="processBtn" class="process-btn">
                        <span>🧠 Procesar con IA</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Sección de procesamiento -->
        <section class="processing-section" id="processingSection" style="display: none;">
            <div class="processing-card">
                <div class="processing-header">
                    <h3>🤖 Procesando con Groq AI...</h3>
                    <div class="loading-spinner"></div>
                </div>
                <div class="processing-steps">
                    <div class="step" id="step1">
                        <span class="step-icon">🎯</span>
                        <span class="step-text">Transcribiendo audio...</span>
                    </div>
                    <div class="step" id="step2">
                        <span class="step-icon">📝</span>
                        <span class="step-text">Generando título y tags...</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Sección de edición -->
        <section class="editing-section" id="editingSection" style="display: none;">
            <div class="editing-card">
                <h3>✏️ Revisar y Editar</h3>
                <form id="editForm">
                    <div class="form-group">
                        <label for="noteTitle">Título:</label>
                        <input type="text" id="noteTitle" class="form-input" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="noteTranscription">Transcripción:</label>
                        <textarea id="noteTranscription" class="form-textarea" rows="6" required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="noteTags">Tags (separados por comas):</label>
                        <input type="text" id="noteTags" class="form-input" placeholder="trabajo, idea, recordatorio">
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" id="cancelBtn" class="cancel-btn">Cancelar</button>
                        <button type="submit" id="saveBtn" class="save-btn">💾 Guardar Nota</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Sección de notas guardadas -->
        <section class="notes-section">
            <div class="notes-header">
                <h3>📚 Mis Notas</h3>
                <button id="refreshBtn" class="refresh-btn">🔄 Actualizar</button>
            </div>
            <div class="notes-list" id="notesList">
                <div class="loading-notes">Cargando notas...</div>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
